<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="Talentechno - Premier IT Recruitment Partner. Connecting Tech Talent with Tomorrow's Innovations.">
  <meta name="theme-color" content="#000000">
  <title>Talentechno — Connecting Tech Talent with Tomorrow's Innovations</title>

  <!-- Google Fonts: Space Grotesk & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Luxury Dual-Theme Stylesheet -->
  <link rel="stylesheet" href="css/luxury-light.css">
</head>
<body>

  <!-- 1. CURVED-EDGE TRANSPARENT ISLAND NAVBAR -->
  <header class="navbar-wrapper">
    <nav class="navbar-island" aria-label="Main Navigation">
      <!-- Brand Logo -->
      <a href="index.html" class="brand-logo" aria-label="Talentechno Home">
        <div class="logo-badge" aria-hidden="true">T</div>
        <div class="logo-text">Talent<span>echno</span></div>
      </a>

      <!-- Minimal Navbar Actions -->
      <div class="nav-actions">
        <!-- Theme Switcher (Complete Black Dark Theme <-> Complete White Light Theme) -->
        <button type="button" class="theme-switcher-btn" aria-label="Toggle Theme" title="Toggle Theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </nav>
  </header>

  <!-- 0. LIGHTWEIGHT TECH & TALENT NEURAL BACKGROUND (AI/ML • DATA SCIENCE • HIRING NEXUS) -->
  <div class="tech-neural-bg" aria-hidden="true">
    <!-- Cyber Synaptic Grid (CSS Matrix) -->
    <div class="cyber-grid-plane"></div>

    <!-- Vector Neural Nexus: Nodes & Synapses representing AI/ML, Data Science, and Tech Hiring -->
    <svg class="neural-lattice-svg" viewBox="0 0 1440 900" fill="none" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="synapse-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--neural-synapse-start)" stop-opacity="0.6"/>
          <stop offset="50%" stop-color="var(--neural-synapse-mid)" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="var(--neural-synapse-end)" stop-opacity="0.3"/>
        </linearGradient>
        <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="var(--neural-node-color)" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="var(--neural-node-color)" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Neural Synaptic Lines Connecting Tech & AI Talent Clusters -->
      <g class="neural-synapses" stroke="url(#synapse-grad-1)" stroke-width="1.2">
        <!-- Left Cluster: AI / LLM & Data Science -->
        <line x1="180" y1="230" x2="380" y2="330" stroke-dasharray="4 6"/>
        <line x1="120" y1="460" x2="300" y2="540" stroke-dasharray="4 6"/>
        <line x1="380" y1="330" x2="300" y2="540"/>
        <line x1="180" y1="230" x2="120" y2="460"/>
        <line x1="380" y1="330" x2="520" y2="280"/>

        <!-- Interconnecting High-Speed Synapses (Hiring Bridge) -->
        <path d="M 520 280 Q 720 180 920 280" stroke="var(--neural-synapse-mid)" stroke-width="1.5" stroke-dasharray="3 5" fill="none"/>
        <path d="M 380 640 Q 720 730 1060 640" stroke="var(--neural-synapse-mid)" stroke-width="1.5" stroke-dasharray="3 5" fill="none"/>

        <!-- Right Cluster: Cloud, MLOps, Tech Talent Pool -->
        <line x1="920" y1="280" x2="1060" y2="330"/>
        <line x1="1060" y1="330" x2="1280" y2="230" stroke-dasharray="4 6"/>
        <line x1="1060" y1="330" x2="1180" y2="530"/>
        <line x1="1280" y1="230" x2="1320" y2="460"/>
        <line x1="1320" y1="460" x2="1180" y2="530" stroke-dasharray="4 6"/>
        <line x1="1180" y1="530" x2="1060" y2="640"/>
        <line x1="300" y1="540" x2="380" y2="640"/>
      </g>

      <!-- Tech Domain Nodes with Badges & Text -->
      <g class="neural-nodes">
        <!-- Node 1: AI / LLM Models -->
        <circle cx="180" cy="230" r="5" fill="var(--neural-node-color)"/>
        <circle cx="180" cy="230" r="14" fill="url(#node-glow)"/>
        <text x="195" y="234" class="node-label">AI • LLMs</text>

        <!-- Node 2: Data Science -->
        <circle cx="120" cy="460" r="4.5" fill="var(--neural-node-color)"/>
        <circle cx="120" cy="460" r="12" fill="url(#node-glow)"/>
        <text x="35" y="464" class="node-label">Data Science</text>

        <!-- Node 3: Neural Core -->
        <circle cx="380" cy="330" r="6" fill="var(--neural-node-color)"/>
        <circle cx="380" cy="330" r="18" fill="url(#node-glow)"/>
        <text x="395" y="334" class="node-label">Neural Core</text>

        <!-- Node 4: Distributed Systems -->
        <circle cx="300" cy="540" r="4" fill="var(--neural-node-color)"/>
        <text x="190" y="544" class="node-label">Distributed Cloud</text>

        <!-- Node 5: Hiring Bridge -->
        <circle cx="520" cy="280" r="5" fill="var(--neural-node-color)"/>
        <circle cx="920" cy="280" r="5" fill="var(--neural-node-color)"/>

        <!-- Node 6: Tech Talent Pool -->
        <circle cx="1060" cy="330" r="6" fill="var(--neural-node-color)"/>
        <circle cx="1060" cy="330" r="18" fill="url(#node-glow)"/>
        <text x="1075" y="334" class="node-label">Tech Talent Pool</text>

        <!-- Node 7: MLOps Architecture -->
        <circle cx="1280" cy="230" r="5" fill="var(--neural-node-color)"/>
        <circle cx="1280" cy="230" r="14" fill="url(#node-glow)"/>
        <text x="1205" y="215" class="node-label">MLOps</text>

        <!-- Node 8: Executive Search -->
        <circle cx="1320" cy="460" r="4.5" fill="var(--neural-node-color)"/>
        <text x="1335" y="464" class="node-label">Executive IT</text>

        <!-- Node 9: Scale-Out Engineering -->
        <circle cx="1180" cy="530" r="4" fill="var(--neural-node-color)"/>
        <text x="1195" y="534" class="node-label">Scale-Out</text>
      </g>
    </svg>

    <!-- Focal Ambient Glow (Soft Purple in Dark Theme, Soft Gold in Light Theme) -->
    <div class="tech-ambient-glow"></div>
  </div>

  <!-- 2. FIRST LANDING PAGE: COMPLETELY TRANSPARENT CARD ON THEMED BACKGROUND -->
  <main class="content-container">
    <section class="landing-hero-center">
      <div class="landing-card-glass">
        <!-- Tech Hiring Accreditation Badge -->
        <div class="typewriter-badge">
          ✦ Talentechno • Tech Talent Nexus ✦
        </div>

        <!-- Typescripting Animated Quote of Talentechno -->
        <div class="typewriter-quote-box">
          <h1 class="typewriter-heading">
            &ldquo;<span class="typewriter-text"></span><span class="typewriter-cursor" aria-hidden="true"></span>&rdquo;
          </h1>
        </div>

        <!-- Quote Context / Tech Hiring Mission Tag -->
        <div class="typewriter-author-tag">
          — <strong id="quote-author-label">Talentechno Mission</strong>
        </div>

        <!-- The Exactly 2 Buttons Requested -->
        <div class="landing-2-buttons">
          <!-- Button 1: Quote Button -->
          <button type="button" class="btn-primary" data-modal-action="quote">
            <span>Get a Quote</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>

          <!-- Button 2: Enquire Button -->
          <button type="button" class="btn-outline" data-modal-action="enquire">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>Enquire Now</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- 5. INTERACTIVE MODAL (FOR THE 2 BUTTONS) -->
  <div class="modal-overlay" id="quote-enquiry-modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button type="button" class="modal-close-btn" aria-label="Close Modal">✕</button>

      <div style="margin-bottom: 24px;">
        <div class="section-tag" id="modal-badge">Direct Executive Portal</div>
        <h3 class="section-title" id="modal-title" style="font-size: 24px; margin-bottom: 8px;">Get a Talent Quote</h3>
        <p class="section-subtitle" id="modal-subtitle" style="font-size: 13.5px;">
          Tell us your role requirements, tech stack, and budget. Receive a tailored quote and candidate shortlist within 24 hours.
        </p>
      </div>

      <form id="quote-enquiry-form">
        <input type="hidden" name="type" id="form-inquiry-type" value="Talent Quote">

        <div class="form-group-grid">
          <div>
            <label style="display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px;">Your Name *</label>
            <input type="text" name="name" class="form-input" placeholder="e.g. Vikram Reddy" required>
          </div>
          <div>
            <label style="display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px;">Work Email *</label>
            <input type="email" name="email" class="form-input" placeholder="e.g. vikram@enterprise.com" required>
          </div>
        </div>

        <div class="form-group-grid">
          <div>
            <label style="display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px;">Company / Organization</label>
            <input type="text" name="company" class="form-input" placeholder="e.g. NextGen Cloud Labs">
          </div>
          <div>
            <label style="display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px;">Phone / WhatsApp *</label>
            <input type="tel" name="phone" class="form-input" placeholder="+91 98765 43210" required>
          </div>
        </div>

        <div style="margin-bottom: 14px;">
          <label style="display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px;">Service Required</label>
          <select name="service" class="form-input" style="cursor: pointer; appearance: auto;">
            <option value="Talent Management">Talent Management & Executive Search</option>
            <option value="Recruitment Process">Full-Lifecycle IT Recruitment</option>
            <option value="HR Consulting">HR Consulting & Workforce Strategy</option>
            <option value="Staff Support">Ongoing Staff Support / Contract-to-Hire</option>
            <option value="General">Other / Custom Inquiry</option>
          </select>
        </div>

        <div style="margin-bottom: 24px;">
          <label style="display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px;">Requirements & Details</label>
          <textarea name="message" class="form-input" rows="3" placeholder="Describe the roles, desired tech skills (e.g. Python, React, Cloud, DevOps), team size, and timeline..."></textarea>
        </div>

        <button type="submit" id="modal-submit-btn" class="btn-primary" style="width: 100%; padding: 13px 24px; font-size: 14.5px;">
          <span>Submit Request</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Main JavaScript Application File -->
  <script src="js/app.js"></script>
</body>
</html>
